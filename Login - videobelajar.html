</head>
<body>

<header>
  <div class="logo">
    <p>videobelajar</p>
  </div>
</header>

<main>
  <div class="card">
    <h1>Masuk ke Akun</h1>
    <p class="subtitle">Yuk, lanjutin belajarmu di videobelajar.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">E-Mail<span class="req">*</span></label>
        <input type="email" id="email" name="email" required placeholder="">
      </div>

      <div class="field">
        <label for="password">Kata Sandi<span class="req">*</span></label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" required placeholder="">
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan kata sandi">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
              <circle cx="12" cy="12" r="3"/>
              <line x1="2" y1="2" x2="22" y2="22"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="forgot"><a href="#">Lupa Password?</a></div>

      <button type="submit" class="btn btn-primary">Masuk</button>
      <button type="button" class="btn btn-secondary" id="daftarBtn">Daftar</button>

      <div class="divider">atau</div>

      <button type="button" class="btn-google">
        <svg viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.5l-6.5-5.4C29.4 34.9 26.9 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.5 5.4C39.9 36.9 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/>
        </svg>
        Masuk dengan Google
      </button>
    </form>
  </div>
</main>

<script>
  const toggleBtn = document.getElementById('togglePass');
  const passInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');
  const eyeOpen = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>';
  const eyeClosed = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/><line x1="2" y1="2" x2="22" y2="22"/>';
  let visible = false;
  toggleBtn.addEventListener('click', () => {
    visible = !visible;
    passInput.type = visible ? 'text' : 'password';
    eyeIcon.innerHTML = visible ? eyeOpen : eyeClosed;
  });

  document.getElementById('daftarBtn').addEventListener('click', () => {
    alert('Menuju halaman pendaftaran...');
  });

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    alert('Login diproses (demo)');
  });
</script>

</body>
