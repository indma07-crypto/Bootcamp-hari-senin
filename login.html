<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Video Belajar</title>
</head>
<body>
    <header>
        <div class="logo">
            <span>videobelajar</span>
        </div>
    </header>

    <main>
        <div class="card">
            <h5>Masuk ke Akun</h5>
            <p class="subtitle">Yuk,lanjutin belajarmu di video belajar.</p>
        

        <form id="loginform">
            <div class="field">
                <label for="email">Email<span class="bintang">*</span></label>
                <input type="email" id="email" name="email" required placeholder="">
            </div>

            <div class="field">
                <label for="password">Kata Sandi<span class="bintang">*</span></label>
                <input type="password"  id="password" nama="password">
            </div>

            <div class="forgot">
                <a href="#lupa_password">Lupa Password?</a>
            </div>

            <button type="submit" class="btn btn-primary">Masuk</button>
            <button type="button" class="btn btn-secondary" id="daftarBtn">Daftar</button>

            <div class="divider">atau</div>

            <button type="button" class="btn-google">
                <span class="wrapper-google">
                <img src="pngwing.com.png" alt="google.com">
                </span>
                <span class="masuk-google">Masuk dengan Google</span>
            </button>      
        </form>
    </div>
    </main>
</body>
</html>
