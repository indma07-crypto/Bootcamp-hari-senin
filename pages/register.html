<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/register.css">
    <title>VideoBelajar</title>
</head>
<body>
    <nav>
        <img src="../assets/Logo.png" alt="logo video belajar">
    </nav>
    <main>
        <div class="login">
            <div class="judullogin">
                <h3 class="heading-3">Pendaftaran Akun</h3>
                <p class="body-medium-regular">Yuk, Daftarkan akunmu sekarang juga.</p>
            </div>
            <div class="formlogin">
                <div class="input">
                    <label for="name" class="body-medium-regular">Nama Lengkap<span>*</span></label>
                    <input type="text" id="name" class="name" placeholder="">

                    <label for="email" class="body-medium-regular">E-mail<span>*</span></label>
                    <input type="email" id="email" class="email" placeholder="">
                    
                    <label for="gender" id="gender" class="body-medium-regular">Jenis Kelamin<span>*</span></label>
                    <select id="gender" name="gender" class="gender"><option value="Wanita">Wanita</option><option value="Pria">Pria</option></select>
                    
                    <label for="number" class="body-medium-regular">No. HP<span>*</span></label>
                    <input type="number" id="number" class="number" placeholder="">

                    <label for="password" class="body-medium-regular">Kata Sandi<span>*</span></label>
                    <input type="password" id="password" class="password" placeholder="">

                    <label for="confirm-password" class="body-medium-regular">Konfirmasi Kata Sandi<span>*</span></label>
                    <input type="password" id="confirm-password" class="confirm-password" placeholder="">
                    
                    <a class="divider">Lupa password?</a>
                </div>

                <div class="btn">
                    <button class="btn-primary-contained">Masuk</button>
                    <button class="btn-primary-shadow">Login</button>
                </div>

                
                <p class="atau">atau</p>

                <button class="btn-google">
                    <img src="../assets/logos_google-icon.png" alt="logo-google">
                    <p class="text-google">Masuk dengan Google</p>
                </button>
            </div>
        </div>
    </div>
    </main>
</body>
</html>
